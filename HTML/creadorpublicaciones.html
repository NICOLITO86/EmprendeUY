<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creador de Publicaciones</title>
    <link rel="stylesheet" href="../CSS/creadorpublicaciones.css">
</head>
<body>

    <div class="header">
        <h1>EmprendeUY</h1>
        <div class="header-acciones">
            <a class="btn-nueva" href="mis_publicaciones.html">Mi catalogo</a>
            <a class="btn-salir" href="../PHP/logout.php">Cerrar sesión</a>
        </div>
    </div>

    <div class="contenedor-centrado">
        <div class="creadorpublicaciones">
            <h1>Creador de Publicaciones</h1>
            <div id="div"></div>
            <form id="crearpublicaiones">
                <label for="titulo">Título</label>
                <input type="text" id="titulo" name="titulo">

                <label for="descripcion">Descripción</label>
                <input type="text" id="descripcion" name="descripcion">

                <label for="categoria">Categoría</label>
                <select id="categoria" name="categoria">
                    <option value="">Seleccione...</option>
                    <option value="Ropa">Ropa</option>
                    <option value="Hogar">Hogar</option>
                    <option value="Tecnologia">Tecnologia</option>
                    <option value="Carpinteria">Carpinteria</option>
                    <option value="Herreria">Herreria</option>
                    <option value="Higiene">Higiene</option>
                    <option value="Deportes">Deportes</option>
                </select>

                <label for="precio">Precio</label>
                <input type="number" id="precio" name="precio">

                <label for="foto">Imagen</label>
                <input type="file" name="foto" id="foto">

                <button type="submit">Publicar</button>
            </form>
        </div>
    </div>

    <script src="../JS/crearpublicaiones.js"></script>
</body>
</html>
