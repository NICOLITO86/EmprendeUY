<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1b25af">
    <link rel="stylesheet" href="../CSS/Emprendeuy.css">
    <link rel="stylesheet" href="../CSS/tienda.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <title>Tienda | EmprendeUY</title>
</head>
<body>

    <header>
        <a class="marca" href="EmprendeUY.html" aria-label="EmprendeUY, inicio">
            <svg viewBox="0 0 40 40" aria-hidden="true">
                <defs>
                    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0" stop-color="#1f8eb9"/><stop offset="1" stop-color="#1b25af"/>
                    </linearGradient>
                </defs>
                <rect width="40" height="40" rx="11" fill="url(#g)"/>
                <path d="M12 26l6-6 4 4 7-9" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M24 15h5v5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>EmprendeUY</span>
        </a>

        <!-- Con sesión iniciada (tienda-visitante.js los cambia por los de visitante si no hay sesión) -->
        <div class="acciones" id="acciones-usuario">
            <a class="a2" href="carrito.html">Ver carrito</a>
            <a class="a1" href="../PHP/logout.php">Cerrar sesión</a>
        </div>

        <div class="acciones" id="acciones-visitante" hidden>
            <a class="a1" href="iniciar_sesion.html">Iniciar sesión</a>
            <a class="a2" href="Registrarse.html">Registrarse</a>
        </div>
    </header>

    <main>

        <!-- Solo se muestra a los visitantes (lo activa tienda-visitante.js) -->
        <div class="aviso-visitante" id="aviso" hidden>
            <p>Estás mirando la tienda como visitante. Para comprar, iniciá sesión o registrate.</p>
            <a class="a1" href="iniciar_sesion.html">Iniciar sesión</a>
        </div>

        <div class="tienda-intro">
            <h2>Descubrí productos de emprendedores uruguayos</h2>
            <p>Cada compra apoya directamente a un pequeño negocio local.</p>
        </div>

        <div class="tienda-filtros">
            <input type="text" id="buscador" placeholder="Buscar productos...">
            <select id="filtro-categoria">
                <option value="todas">Todas las categorías</option>
            </select>
        </div>

        <h2 id="titulo" hidden>Todos los productos</h2>

        <div id="productos"></div>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../JS/tienda.js"></script>

    <!-- Complemento opcional: modo visitante y categoria desde la portada. No modifica tienda.js -->
    <script src="../JS/tienda-visitante.js"></script>

</body>
</html>
