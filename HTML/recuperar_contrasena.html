<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1b25af">
    <title>Recuperar contraseña - EmprendeUY</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- CSS común, el de la tarjeta de login y el propio de estas pantallas -->
    <link rel="stylesheet" href="../CSS/Emprendeuy.css">
    <link rel="stylesheet" href="../CSS/iniciar_sesion.css">
    <link rel="stylesheet" href="../CSS/verificacion.css">
</head>
<body>

<!-- Misma cabecera que la portada -->
<header>
    <a class="marca" href="EmprendeUY.html" aria-label="EmprendeUY, inicio">
        <img src="../Imagenes/EmprendeUy.png" alt="EmprendeUY">
        <span>EmprendeUY</span>
    </a>

    <div class="acciones">
        <a class="a1" href="iniciar_sesion.html">Iniciar sesión</a>
        <a class="a2" href="EmprendeUY.html">Volver al inicio</a>
    </div>
</header>

<main>
    <section id="contenedor" class="login">
        <h1>Recuperar contraseña</h1>

        <!-- Paso 1: pedir el código -->
        <form id="formSolicitar" autocomplete="on">
            <p class="login__sub">Ingresá el correo de tu cuenta y te enviamos un código para crear una contraseña nueva.</p>
            <div class="campo">
                <label for="correoSolicitar">Correo electrónico</label>
                <input type="email" id="correoSolicitar" name="correo" autocomplete="email" required>
            </div>
            <button type="submit" class="login__enviar" id="btnSolicitar">Enviar código</button>
            <button type="button" id="btnYaTengo" class="login__secundario">Ya tengo un código</button>
        </form>

        <!-- Paso 2: código + contraseña nueva -->
        <form id="formConfirmar" class="oculto" autocomplete="off">
            <p class="login__sub">Ingresá el código que te llegó y elegí tu contraseña nueva.</p>

            <div class="campo">
                <label for="correoConfirmar">Correo electrónico</label>
                <input type="email" id="correoConfirmar" name="correo" autocomplete="email" required>
            </div>

            <div class="campo">
                <label for="codigo">Código de 6 dígitos</label>
                <input type="text" id="codigo" name="codigo" class="codigo" inputmode="numeric"
                       maxlength="6" autocomplete="one-time-code" placeholder="000000" required>
            </div>

            <div class="campo">
                <label for="nueva">Contraseña nueva (mínimo 8 caracteres)</label>
                <input type="password" id="nueva" name="nueva" autocomplete="new-password" minlength="8" required>
            </div>

            <div class="campo">
                <label for="confirmar">Repetí la contraseña nueva</label>
                <input type="password" id="confirmar" name="confirmar" autocomplete="new-password" minlength="8" required>
            </div>

            <button type="submit" class="login__enviar" id="btnConfirmar">Cambiar contraseña</button>
            <button type="button" id="btnReenviar" class="login__secundario" disabled>Reenviar código</button>
        </form>

        <p id="mensaje" role="alert"></p>

        <p class="login__alt"><a href="iniciar_sesion.html">Volver a iniciar sesión</a></p>
    </section>
</main>

<script src="../JS/recuperar_contrasena.js"></script>

</body>
</html>
